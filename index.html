<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F766E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="הבית שלנו" />
  <title>הבית שלנו — ניהול בית משותף</title>

  <!-- Google Fonts: Heebo (Hebrew-first clean typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Heebo', 'sans-serif'] },
          boxShadow: {
            soft: '0 4px 20px -4px rgba(15, 23, 42, 0.06), 0 2px 6px -2px rgba(15, 23, 42, 0.03)',
            card: '0 8px 28px -8px rgba(15, 23, 42, 0.08)',
            nav: '0 -6px 24px -6px rgba(15, 23, 42, 0.09)'
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --brand: #0F766E;
      --brand-dark: #115E59;
    }
    body {
      font-family: 'Heebo', sans-serif;
      background-color: #F7F6F2;
      color: #1C1917;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    /* Dynamic Accent Overrides */
    .bg-\[\#0F766E\] { background-color: var(--brand) !important; }
    .hover\:bg-\[\#115E59\]:hover { background-color: var(--brand-dark) !important; }
    .text-\[\#0F766E\] { color: var(--brand) !important; }
    .border-\[\#0F766E\] { border-color: var(--brand) !important; }
    .from-\[\#0F766E\] { --tw-gradient-from: var(--brand) var(--tw-gradient-from-position) !important; }
    .to-\[\#115E59\] { --tw-gradient-to: var(--brand-dark) var(--tw-gradient-to-position) !important; }

    /* Clean Dark Mode */
    body.dark-mode { background-color: #111615; color: #F5F5F4; }
    body.dark-mode header,
    body.dark-mode nav.fixed,
    body.dark-mode #modal-panel { background-color: rgba(24, 31, 30, 0.96) !important; border-color: #2A3634 !important; color: #F5F5F4; }
    body.dark-mode .bg-white { background-color: #1B2322 !important; }
    body.dark-mode .bg-stone-50,
    body.dark-mode .bg-stone-50\/50,
    body.dark-mode .bg-stone-50\/60,
    body.dark-mode .bg-stone-50\/70,
    body.dark-mode .bg-stone-50\/90,
    body.dark-mode .bg-stone-100,
    body.dark-mode .bg-stone-100\/80,
    body.dark-mode .bg-stone-100\/90,
    body.dark-mode .bg-stone-200\/70 { background-color: #232D2C !important; }
    body.dark-mode .border-stone-100,
    body.dark-mode .border-stone-200,
    body.dark-mode .border-stone-200\/60,
    body.dark-mode .border-stone-200\/70,
    body.dark-mode .border-stone-200\/80 { border-color: #2E3B39 !important; }
    body.dark-mode .divide-stone-100 > :not([hidden]) ~ :not([hidden]) { border-color: #2A3634 !important; }
    body.dark-mode .text-stone-900,
    body.dark-mode .text-stone-800 { color: #F5F5F4 !important; }
    body.dark-mode .text-stone-700,
    body.dark-mode .text-stone-600 { color: #D6D3D1 !important; }
    body.dark-mode .text-stone-500,
    body.dark-mode .text-stone-400 { color: #A8A29E !important; }
    body.dark-mode input,
    body.dark-mode select,
    body.dark-mode textarea { background-color: #141B1A !important; color: #F5F5F4 !important; border-color: #334240 !important; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.16s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen selection:bg-teal-100 selection:text-teal-900 overflow-x-hidden">

  <!-- ==================== TOP HEADER (MOBILE & DESKTOP) ==================== -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-stone-200/80">
    <div class="max-w-5xl mx-auto px-3.5 sm:px-5 h-16 flex items-center justify-between gap-2">
      <!-- Brand Logo & Subtitle -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#0F766E] to-[#115E59] text-white flex items-center justify-center shadow-sm shrink-0">
          <i data-lucide="home" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-stone-900 leading-tight whitespace-nowrap">הבית שלנו</h1>
            <button type="button" onclick="openSettingsModal()" title="סטטוס שמירה, סנכרון וקוד בית"
              class="hidden xl:inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-stone-100 hover:bg-stone-200/80 transition text-[10px] font-bold text-stone-600 shrink-0">
              <span id="sync-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              <span id="sync-text">נשמר מקומית</span>
              <span id="sync-code-short" class="font-mono text-[10px] text-stone-500"></span>
            </button>
          </div>
          <p id="header-subtitle" class="text-[11px] sm:text-xs text-stone-500 font-medium truncate">טוען נתונים...</p>
        </div>
      </div>

      <!-- Desktop 5-Tab Navigation -->
      <nav class="hidden lg:flex items-center gap-1 bg-stone-100/90 p-1 rounded-2xl border border-stone-200/70">
        <button type="button" data-desktop-tab="today" onclick="switchTab('today')" class="desktop-nav-btn whitespace-nowrap flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold transition">
          <i data-lucide="sun" class="w-4 h-4"></i><span>היום</span>
        </button>
        <button type="button" data-desktop-tab="finance" onclick="switchTab('finance')" class="desktop-nav-btn whitespace-nowrap flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold transition">
          <i data-lucide="wallet" class="w-4 h-4"></i><span>כלכלה</span>
          <span class="desktop-badge-finance hidden px-1.5 py-0.5 rounded-full bg-rose-600 text-white text-[10px] tabular-nums">0</span>
        </button>
        <button type="button" data-desktop-tab="shopping" onclick="switchTab('shopping')" class="desktop-nav-btn whitespace-nowrap flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold transition">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i><span>קניות</span>
          <span class="desktop-badge-shopping hidden px-1.5 py-0.5 rounded-full bg-[#0F766E] text-white text-[10px] tabular-nums">0</span>
        </button>
        <button type="button" data-desktop-tab="home" onclick="switchTab('home')" class="desktop-nav-btn whitespace-nowrap flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold transition">
          <i data-lucide="home" class="w-4 h-4"></i><span>בית</span>
          <span class="desktop-badge-home hidden px-1.5 py-0.5 rounded-full bg-amber-600 text-white text-[10px] tabular-nums">0</span>
        </button>
        <button type="button" data-desktop-tab="planning" onclick="switchTab('planning')" class="desktop-nav-btn whitespace-nowrap flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold transition">
          <i data-lucide="calendar" class="w-4 h-4"></i><span>יומן ותכנון</span>
        </button>
      </nav>

      <!-- Header Right Actions: Desktop Quick Add + Dark Mode + Settings -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button type="button" onclick="openQuickAddHub()"
          class="hidden lg:flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-[#0F766E] hover:bg-[#115E59] active:scale-95 text-white font-bold text-xs shadow-sm transition whitespace-nowrap">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>הוספה מהירה</span>
        </button>
        <button type="button" onclick="openGlobalSearchModal()" aria-label="חיפוש מהיר" title="חיפוש מהיר בכל האפליקציה"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-stone-100 hover:bg-stone-200/80 text-stone-700 flex items-center justify-center transition">
          <i data-lucide="search" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
        <button type="button" id="dark-mode-btn" onclick="toggleDarkMode()" aria-label="מצב כהה" title="מצב כהה / בהיר"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-stone-100 hover:bg-stone-200/80 text-stone-700 flex items-center justify-center transition">
          <i data-lucide="moon" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
        <button type="button" onclick="openSettingsModal()" aria-label="הגדרות"
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-stone-100 hover:bg-stone-200/80 text-stone-700 flex items-center justify-center transition">
          <i data-lucide="settings" class="w-4 h-4 sm:w-5 sm:h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== DEMO DATA BANNER ==================== -->
  <div id="demo-banner" class="hidden max-w-5xl mx-auto px-3.5 sm:px-5 pt-3">
    <div class="bg-amber-50 border border-amber-200/90 rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-3 text-xs sm:text-sm text-amber-900">
      <div class="flex items-center gap-2 min-w-0">
        <i data-lucide="sparkles" class="w-4 h-4 text-amber-600 shrink-0"></i>
        <span class="truncate sm:whitespace-normal">מוצגים נתוני דוגמה להתנסות — תוכלו לנקות ולהתחיל מדף נקי בכל רגע.</span>
      </div>
      <button type="button" onclick="confirmClearAllData()"
        class="shrink-0 px-3 py-1.5 rounded-xl bg-white hover:bg-amber-100 text-amber-800 font-bold border border-amber-200 transition text-xs">
        נקה נתוני דוגמה
      </button>
    </div>
  </div>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="max-w-5xl mx-auto px-3.5 sm:px-5 pt-4 pb-28 lg:pb-14">
    <div id="loading-screen" class="py-24 flex flex-col items-center justify-center text-center gap-3">
      <div class="w-14 h-14 rounded-3xl bg-teal-50 text-[#0F766E] flex items-center justify-center animate-pulse shadow-sm">
        <i data-lucide="home" class="w-7 h-7"></i>
      </div>
      <p class="text-sm font-semibold text-stone-500">טוען את הנתונים המשותפים שלכם...</p>
    </div>
    <div id="tab-content" class="hidden space-y-4"></div>
  </main>

  <!-- ==================== MOBILE THUMB-ZONE QUICK-ADD FAB ==================== -->
  <button type="button" onclick="openQuickAddHub()" aria-label="הוספה מהירה"
    class="lg:hidden fixed bottom-[86px] left-4 z-30 w-14 h-14 rounded-2xl bg-[#0F766E] hover:bg-[#115E59] active:scale-95 text-white shadow-xl flex items-center justify-center transition">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- ==================== MOBILE BOTTOM NAVIGATION (5 MAIN TABS) ==================== -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-stone-200/80 shadow-nav">
    <div class="max-w-lg mx-auto grid grid-cols-5 h-[72px] px-1">
      <button type="button" data-tab="today" onclick="switchTab('today')" class="nav-btn flex flex-col items-center justify-center gap-1 rounded-2xl my-1.5 mx-0.5 transition">
        <i data-lucide="sun" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">היום</span>
      </button>
      <button type="button" data-tab="finance" onclick="switchTab('finance')" class="nav-btn flex flex-col items-center justify-center gap-1 rounded-2xl my-1.5 mx-0.5 transition">
        <div class="relative">
          <i data-lucide="wallet" class="w-5 h-5"></i>
          <span id="badge-finance" class="hidden absolute -top-1.5 -left-2.5 min-w-[16px] h-[16px] px-1 rounded-full bg-rose-600 text-white text-[9px] font-bold flex items-center justify-center tabular-nums">0</span>
        </div>
        <span class="text-[10px] font-bold">כלכלה</span>
      </button>
      <button type="button" data-tab="shopping" onclick="switchTab('shopping')" class="nav-btn flex flex-col items-center justify-center gap-1 rounded-2xl my-1.5 mx-0.5 transition">
        <div class="relative">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <span id="badge-shopping" class="hidden absolute -top-1.5 -left-2.5 min-w-[16px] h-[16px] px-1 rounded-full bg-[#0F766E] text-white text-[9px] font-bold flex items-center justify-center tabular-nums">0</span>
        </div>
        <span class="text-[10px] font-bold">קניות</span>
      </button>
      <button type="button" data-tab="home" onclick="switchTab('home')" class="nav-btn flex flex-col items-center justify-center gap-1 rounded-2xl my-1.5 mx-0.5 transition">
        <div class="relative">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span id="badge-home" class="hidden absolute -top-1.5 -left-2.5 min-w-[16px] h-[16px] px-1 rounded-full bg-amber-600 text-white text-[9px] font-bold flex items-center justify-center tabular-nums">0</span>
        </div>
        <span class="text-[10px] font-bold">בית</span>
      </button>
      <button type="button" data-tab="planning" onclick="switchTab('planning')" class="nav-btn flex flex-col items-center justify-center gap-1 rounded-2xl my-1.5 mx-0.5 transition">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">יומן ותכנון</span>
      </button>
    </div>
  </nav>

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-stone-900/50 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fade-in" onclick="handleBackdropClick(event)">
    <div id="modal-panel" class="w-full sm:max-w-lg bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[92vh] overflow-y-auto animate-slide-up"></div>
  </div>

  <!-- ==================== TOAST CONTAINER ==================== -->
  <div id="toast-container" class="fixed top-20 inset-x-4 z-50 pointer-events-none flex flex-col items-center gap-2"></div>

  <!-- Hidden file inputs for JSON backup & ICS Google Calendar import -->
  <input type="file" id="import-json-input" accept=".json,application/json" class="hidden" onchange="handleImportFile(event)" />
  <input type="file" id="import-ics-input" accept=".ics,text/calendar" class="hidden" onchange="handleImportIcsFile(event)" />

    function getTodayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function offsetDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function addMonthsISO(iso, months) {
      const d = iso ? new Date(iso + 'T12:00:00') : new Date();
      if (isNaN(d.getTime())) return offsetDaysISO((Number(months) || 1) * 30);
      d.setMonth(d.getMonth() + (Number(months) || 1));
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function makeDateInOffsetMonth(monthOffset, day) {
      const d = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
      const maxD = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(Math.min(day, maxD)).padStart(2, '0')}`;
    }
    function makeDateInCurrentMonth(day) { return makeDateInOffsetMonth(0, day); }
    function getDaysUntil(iso) {
      if (!iso) return 999;
      const t = new Date(); t.setHours(0, 0, 0, 0);
      const target = new Date(iso + 'T00:00:00');
      return isNaN(target.getTime()) ? 999 : Math.round((target - t) / 86400000);
    }

      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

      return code;

    // Authentic Hebrew Gematria & Hebrew Calendar Date Formatter
    function toHebrewGematria(num) {
      let n = Math.floor(Number(num) || 0);
      if (n <= 0) return '';
      if (n >= 5000) n = n % 1000;
      const map = [
        [400, 'ת'], [300, 'ש'], [200, 'ר'], [100, 'ק'],
        [90, 'צ'], [80, 'פ'], [70, 'ע'], [60, 'ס'], [50, 'נ'],
        [40, 'מ'], [30, 'ל'], [20, 'כ'], [10, 'י'],
        [9, 'ט'], [8, 'ח'], [7, 'ז'], [6, 'ו'], [5, 'ה'],
        [4, 'ד'], [3, 'ג'], [2, 'ב'], [1, 'א']
      ];
      let out = '';
      for (const [val, ch] of map) {
        if (n === 15) { out += 'טו'; n = 0; break; }
        if (n === 16) { out += 'טז'; n = 0; break; }
        while (n >= val) {
          out += ch;
          n -= val;
          if (n === 15) { out += 'טו'; n = 0; break; }
          if (n === 16) { out += 'טז'; n = 0; break; }
        }
      }
      if (out.length === 1) return out + '׳';
      if (out.length > 1) return out.slice(0, -1) + '״' + out.slice(-1);
      return out;
    }

    function getHebrewDateInfo(dateOrIso) {
      const d = typeof dateOrIso === 'string' ? new Date(dateOrIso + 'T12:00:00') : dateOrIso;
      if (!d || isNaN(d.getTime())) return { dayStr: '', monthStr: '', yearStr: '', short: '', full: '' };
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }).formatToParts(d);
        const dayNum = parseInt((parts.find(p => p.type === 'day') || {}).value, 10) || 1;
        const monthEn = (parts.find(p => p.type === 'month') || {}).value || '';
        const yearNum = parseInt((parts.find(p => p.type === 'year') || {}).value, 10) || 5786;
        const dayStr = toHebrewGematria(dayNum);
        const monthStr = HEBREW_CAL_MONTHS[monthEn] || monthEn;
        const yearStr = toHebrewGematria(yearNum);
        return {
          dayNum, dayStr, monthStr, yearStr,
          short: `${dayStr} ${monthStr}`,
          full: `${dayStr} ב${monthStr} ${yearStr}`
        };
      } catch (e) {
        return { dayNum: 1, dayStr: '', monthStr: '', yearStr: '', short: '', full: '' };
      }
    }

    function getHebrewMonthRangeLabel(year, month) {
      const first = getHebrewDateInfo(new Date(year, month, 1, 12, 0, 0));
      const last = getHebrewDateInfo(new Date(year, month + 1, 0, 12, 0, 0));
      if (!first.monthStr) return '';
      if (first.monthStr === last.monthStr) return `${first.monthStr} ${first.yearStr}`;
      return `${first.monthStr} – ${last.monthStr} ${last.yearStr}`;

    async function requestScreenWakeLock(silent = false) {
      wakeLockDesired = true;
      try {
        if ('wakeLock' in navigator && navigator.wakeLock && navigator.wakeLock.request) {
          if (wakeLockSentinel) { try { await wakeLockSentinel.release(); } catch (e) {} }
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
            updateWakeLockUI();
          });
          updateWakeLockUI();
          if (!silent) showToast('🔆 המסך יישאר דולק בזמן הבישול', 'info');
          return true;
        }
      } catch (e) { /* Ignore browser block */ }
      updateWakeLockUI();
      return false;
    }

    async function releaseScreenWakeLock(silent = true) {
      wakeLockDesired = false;
      if (wakeLockSentinel) {
        try { await wakeLockSentinel.release(); } catch (e) {}
        wakeLockSentinel = null;
      }
      updateWakeLockUI();
      if (!silent) showToast('שמירת מסך דולק כובתה');
    }

    function toggleScreenWakeLock() {
      if (wakeLockDesired) releaseScreenWakeLock(false);
      else requestScreenWakeLock(false);
    }

    function updateWakeLockUI() {
      const active = wakeLockDesired;
      document.querySelectorAll('.wake-lock-btn').forEach(btn => {
        btn.className = `wake-lock-btn inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-extrabold border transition ${active ? 'bg-amber-100 text-amber-900 border-amber-300 shadow-sm' : 'bg-white text-stone-600 border-stone-200 hover:bg-stone-50'}`;
        btn.innerHTML = active
          ? '<i data-lucide="sun" class="w-3.5 h-3.5 text-amber-600"></i><span>מסך דולק פעיל ✓</span>'
          : '<i data-lucide="moon" class="w-3.5 h-3.5"></i><span>השאר מסך דולק</span>';
        refreshIcons(btn);
      });
    }

    function copyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
          return true;
        }
        return fallbackCopy(text);
      } catch (e) { return fallbackCopy(text); }
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }

    function buildGoogleCalendarUrl(rem) {
      const dateStr = rem.date || getTodayISO();
      const timeParts = (rem.time || '10:00').split(':');
      const hh = String(Number(timeParts[0]) || 10).padStart(2, '0');
      const mm = String(Number(timeParts[1]) || 0).padStart(2, '0');
      const startDt = new Date(`${dateStr}T${hh}:${mm}:00`);
      const endDt = new Date(startDt.getTime() + 30 * 60000);
      const pad = (n) => String(n).padStart(2, '0');
      const fmt = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      const dates = isNaN(startDt.getTime()) ? `${dateStr.replace(/-/g, '')}T100000/${dateStr.replace(/-/g, '')}T103000` : `${fmt(startDt)}/${fmt(endDt)}`;
      const storeLabel = rem.store ? getStoreInfo(rem.store).label : 'קניות';
      const title = `🛒 ${rem.title || 'תזכורת קניות'} (${storeLabel})`;
      const details = `${rem.note ? rem.note + '\n\n' : ''}תזכורת מאפליקציית הבית שלנו`;
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${encodeURIComponent(dates)}&details=${encodeURIComponent(details)}`;
    }

    function buildCalendarEventGoogleUrl(ev) {
      const dateStr = ev.date || getTodayISO();
      const startT = ev.startTime || '09:00';
      const endT = ev.endTime || '';
      const startDt = new Date(`${dateStr}T${startT}:00`);
      let endDt = endT ? new Date(`${dateStr}T${endT}:00`) : new Date(startDt.getTime() + 60 * 60000);
      if (isNaN(endDt.getTime()) || endDt <= startDt) endDt = new Date(startDt.getTime() + 60 * 60000);
      const pad = (n) => String(n).padStart(2, '0');
      const fmt = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      const dates = ev.allDay
        ? `${dateStr.replace(/-/g, '')}/${offsetDateByOne(dateStr).replace(/-/g, '')}`
        : `${fmt(startDt)}/${fmt(endDt)}`;
      const heb = getHebrewDateInfo(dateStr);
      const details = `${ev.notes ? ev.notes + '\n' : ''}תאריך עברי: ${heb.full}\nנוצר באפליקציית הבית שלנו`;
      let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title || 'אירוע')}&dates=${encodeURIComponent(dates)}&details=${encodeURIComponent(details)}`;
      if (ev.location) url += `&location=${encodeURIComponent(ev.location)}`;
      return url;
    }

        const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

    // 4B. LIVE REAL-TIME CLOUD SYNC (FIREBASE FIRESTORE — OPTIONAL)
    // =========================================================================
    const CLIENT_SESSION_ID = genId('dev');
    let cloudSyncState = { enabled: false, status: 'local', unsub: null, db: null, docFn: null, setDocFn: null, config: null };
    let cloudWriteTimer = null;

    function loadSavedFirebaseConfig() {
      try {
        const raw = localStorage.getItem('our_home_firebase_cfg');
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function saveFirebaseConfigToLocal(cfg) {
      try {
        if (cfg) localStorage.setItem('our_home_firebase_cfg', JSON.stringify(cfg));
        else localStorage.removeItem('our_home_firebase_cfg');
      } catch (e) {}
    }

    function parseFirebaseConfigInput(rawText) {
      const txt = (rawText || '').trim();
      if (!txt) return null;
      try {
        const parsed = JSON.parse(txt);
        if (parsed && parsed.apiKey && parsed.projectId) return parsed;
      } catch (e) {}
      // Forgiving JS snippet parser (works directly with Firebase Console copy-paste!)
      const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
      const out = {};
      keys.forEach(k => {
        const m = txt.match(new RegExp(`['"]?${k}['"]?\\s*:\\s*['"]([^'"]+)['"]`));
        if (m) out[k] = m[1].trim();
      });
      return (out.apiKey && out.projectId) ? out : null;
    }

    function updateSyncStatusBadge(status, label) {
      cloudSyncState.status = status;
      const dot = document.getElementById('sync-dot');
      const txt = document.getElementById('sync-text');
      if (dot) {
        if (status === 'live') dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        else if (status === 'connecting') dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
        else if (status === 'error') dot.className = 'w-2 h-2 rounded-full bg-rose-500';
        else dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
      }
      if (txt) txt.textContent = label || (status === 'live' ? 'מסונכרן חי ☁️' : 'נשמר מקומית');
    }

    async function connectCloudSync(cfg, pushIfEmpty = true) {
      if (!cfg || !cfg.apiKey || !cfg.projectId) return false;
      if (cloudSyncState.unsub) { try { cloudSyncState.unsub(); } catch (e) {} cloudSyncState.unsub = null; }
      updateSyncStatusBadge('connecting', 'מתחבר לענן...');
      try {
        const appMod = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
        const fsMod = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
        const existingApps = appMod.getApps ? appMod.getApps() : [];
        const fbApp = existingApps.length > 0 ? existingApps[0] : appMod.initializeApp(cfg);
        const db = fsMod.getFirestore(fbApp);
        const hhRef = fsMod.doc(db, 'households', state.householdId);

        cloudSyncState.enabled = true;
        cloudSyncState.db = db;
        cloudSyncState.docFn = fsMod.doc;
        cloudSyncState.setDocFn = fsMod.setDoc;
        cloudSyncState.config = cfg;

        cloudSyncState.unsub = fsMod.onSnapshot(hhRef, (snap) => {
          updateSyncStatusBadge('live', 'מסונכרן חי ☁️');
          if (!snap.exists()) {
            if (pushIfEmpty) pushStateToCloudNow();
            return;
          }
          const data = snap.data();
          if (!data || data.writerId === CLIENT_SESSION_ID) return;
          if (data.meta) state.householdMeta = Object.assign({}, state.householdMeta, data.meta);
          if (data.raw) {
            ALL_COLLECTIONS.forEach(c => {
              state.raw[c] = Array.isArray(data.raw[c]) ? data.raw[c] : [];
            });
          }
          try {
            localStorage.setItem(storageKey(state.householdId), JSON.stringify({ meta: state.householdMeta, raw: state.raw }));
          } catch (e) {}
          applyAppearanceTheme();
          updateHeaderAndNav();
          renderActiveTab();
        }, (err) => {
          updateSyncStatusBadge('error', 'שגיאת סנכרון');
          showToast('שגיאה בחיבור ל-Firebase — בדקו את הרשאות Firestore', 'error');
        });
        return true;
      } catch (e) {
        updateSyncStatusBadge('error', 'שגיאת חיבור');
        return false;
      }
    }

    function scheduleCloudPush() {
      if (!cloudSyncState.enabled || !cloudSyncState.db) return;
      if (cloudWriteTimer) clearTimeout(cloudWriteTimer);
      cloudWriteTimer = setTimeout(pushStateToCloudNow, 250);
    }

    async function pushStateToCloudNow() {
      if (!cloudSyncState.enabled || !cloudSyncState.db || !cloudSyncState.setDocFn) return;
      try {
        const hhRef = cloudSyncState.docFn(cloudSyncState.db, 'households', state.householdId);
        await cloudSyncState.setDocFn(hhRef, {
          writerId: CLIENT_SESSION_ID,
          updatedAt: Date.now(),
          meta: state.householdMeta,
          raw: state.raw
        });
      } catch (e) {
        updateSyncStatusBadge('error', 'שגיאת שמירה');
      }
    }

    function buildMagicInviteUrl() {
      const cfg = cloudSyncState.config || loadSavedFirebaseConfig();
      const base = window.location.origin + window.location.pathname;
      if (!cfg) return base;
      try {
        const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ hh: state.householdId, cfg }))));
        return `${base}#sync=${payload}`;
      } catch (e) { return base; }
    }

    function checkMagicSyncHash() {
      try {
        const h = window.location.hash || '';
        if (!h.startsWith('#sync=')) return null;
        const encoded = h.slice(6);
        const parsed = JSON.parse(decodeURIComponent(escape(atob(encoded))));
        if (parsed && parsed.hh && parsed.cfg && parsed.cfg.apiKey && parsed.cfg.projectId) {
          saveFirebaseConfigToLocal(parsed.cfg);
          try { localStorage.setItem('our_home_active_hh', parsed.hh); } catch (e) {}
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname + window.location.search);
          }
          return parsed;
        }
      } catch (e) {}
      return null;
    }

        }, loaded.meta);

    function upsertItem(col, item, skipRender = false) {
      const list = state.raw[col] || [];
      const fullItem = Object.assign({ householdId: state.householdId, createdAt: Date.now() }, item);
      if (!fullItem.id) fullItem.id = genId(col.slice(0, 2));
      const idx = list.findIndex(x => x.id === fullItem.id);
      if (idx >= 0) list[idx] = Object.assign({}, list[idx], fullItem);
      else list.unshift(fullItem);
      state.raw[col] = list;
      saveStateToStorage();
      if (!skipRender) {
        updateHeaderAndNav();
        renderActiveTab();
      }
      return fullItem;
    }

    function deleteItem(col, id) {
      state.raw[col] = (state.raw[col] || []).filter(x => x.id !== id);
      saveStateToStorage();
      updateHeaderAndNav();
      renderActiveTab();
    }

    function updateMeta(patch) {
      state.householdMeta = Object.assign({}, state.householdMeta, patch, { updatedAt: Date.now() });
      saveStateToStorage();
      updateHeaderAndNav();
      renderActiveTab();
    }

    // Smart Shopping Merge Helper (Deduplication)
    function normalizeShopName(name) {
      return (name || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function addOrMergeShoppingItem(newItem, skipRender = false) {
      const norm = normalizeShopName(newItem.name);
      if (!norm) return { merged: false };
      const existing = getData('shopping').find(i => !i.checked && normalizeShopName(i.name) === norm);
      if (existing) {
        const nextQty = (Number(existing.qty) || 1) + (Number(newItem.qty) || 1);
        const mergedNote = existing.note && newItem.note && !existing.note.includes(newItem.note)
          ? `${existing.note} · ${newItem.note}`
          : (existing.note || newItem.note || '');
        upsertItem('shopping', {
          id: existing.id,
          qty: nextQty,
          urgent: existing.urgent || !!newItem.urgent,
          note: mergedNote
        }, skipRender);
        return { merged: true, item: existing };
      }
      const created = upsertItem('shopping', Object.assign({ checked: false }, newItem), skipRender);
      return { merged: false, item: created };
    }

    function showToast(msg, type = 'success') {
      const wrap = document.getElementById('toast-container');

        error: 'bg-[#E11D48] text-white border-rose-700'

      const icon = type === 'error' ? 'alert-circle' : (type === 'amber' ? 'bell-ring' : (type === 'info' ? 'sparkles' : 'check-circle-2'));

      const nowMs = Date.now();
      const list = getData('shoppingReminders').filter(r => !r.completed && r.notifyEnabled && r.date);

        if (notifiedReminders.has(r.id)) return;
        const target = new Date(`${r.date}T${r.time || '09:00'}:00`).getTime();
        if (!isNaN(target) && target <= nowMs && (nowMs - target) < 86400000) {
          notifiedReminders.add(r.id);
          showToast(`תזכורת קניות: ${r.title}`, 'amber');
        }
      });
    }

    // =========================================================================
    // 7. HEADER, NAVIGATION & BADGES
    // =========================================================================
    function persistLastNav() {
      try {
        localStorage.setItem('our_home_last_nav', JSON.stringify({
          activeTab: state.activeTab,
          financeSubTab: state.financeSubTab,
          shoppingView: state.shoppingView,
          homeSubTab: state.homeSubTab,
          planningSubTab: state.planningSubTab
        }));
      } catch (e) {}
    }

    function restoreLastNav() {
      try {
        const raw = localStorage.getItem('our_home_last_nav');
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p && ['today', 'finance', 'shopping', 'home', 'planning'].includes(p.activeTab)) state.activeTab = p.activeTab;
        if (p && ['overview', 'bills'].includes(p.financeSubTab)) state.financeSubTab = p.financeSubTab;
        if (p && ['list', 'packages'].includes(p.shoppingView)) state.shoppingView = p.shoppingView;
        if (p && ['chores', 'repairs', 'design'].includes(p.homeSubTab)) state.homeSubTab = p.homeSubTab;
        if (p && ['calendar', 'recipes', 'weekly', 'ideas'].includes(p.planningSubTab)) state.planningSubTab = p.planningSubTab;
      } catch (e) {}
    }

    function switchTab(tab, subTab = null) {
      state.activeTab = tab;
      if (tab === 'finance' && subTab) state.financeSubTab = subTab;
      if (tab === 'shopping' && subTab) state.shoppingView = subTab;
      if (tab === 'home' && subTab) state.homeSubTab = subTab;
      if (tab === 'planning' && subTab) state.planningSubTab = subTab;
      if (!(state.activeTab === 'planning' && state.planningSubTab === 'recipes')) {
        releaseScreenWakeLock(true);
      }
      persistLastNav();
      updateHeaderAndNav();
      renderActiveTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateHeaderAndNav() {
      const p1 = state.householdMeta.partner1Name || 'אני';

    function getEventColorObj(colorId, fallbackCatId) {
      if (colorId) {

      const map = { family: 'rose', errand: 'sky', home: 'amber', event: 'teal' };
      return EVENT_COLORS.find(c => c.id === (map[fallbackCatId] || 'teal')) || EVENT_COLORS[0];
    }

    function describeWmoWeather(code) {
      if (code === 0) return { label: 'בהיר ושמשי', icon: 'sun' };
      if (code <= 3) return { label: 'מעונן חלקית', icon: 'cloud-sun' };
      if (code <= 48) return { label: 'ערפל / אובך', icon: 'cloud-fog' };
      if (code <= 67) return { label: 'גשום', icon: 'cloud-rain' };
      if (code <= 77) return { label: 'שלג / ברד קל', icon: 'cloud-snow' };
      if (code <= 82) return { label: 'ממטרים לסירוגין', icon: 'cloud-drizzle' };
      return { label: 'סופת רעמים', icon: 'cloud-lightning' };
    }

    function getClothingRecommendation(w, cityLabel) {
      if (!w || w.temp === null || w.temp === undefined) return '';
      const t = w.feelsLike !== null ? w.feelsLike : w.temp;
      let base = '';
      if (t < 10) base = `מעיל חם, סוודר ושכבות — קר ב${cityLabel}`;
      else if (t < 15) base = 'ג׳קט או סווטשירט חם וחולצה ארוכה';
      else if (t < 20) base = 'חולצה ארוכה דקה או קצרה עם עליונית';
      else if (t < 26) base = 'ביגוד קצר ונעים (כדאי עליונית דקה לערב)';
      else base = 'ביגוד קליל ואוורירי, כובע ושתייה מרובה';
      const extras = [];
      if ((w.rainProb || 0) >= 35 || (w.code >= 51 && w.code <= 99)) extras.push('מטרייה ☔');
      if ((w.wind || 0) >= 24) extras.push('שובר רוח 💨');
      return extras.length > 0 ? `${base} + ${extras.join(' ו')}` : base;
    }

    async function fetchSingleCityWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FJerusalem`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('weather_err');
      const data = await res.json();
      const cur = data.current || {};
      const daily = data.daily || {};
      return {
        temp: Math.round(cur.temperature_2m),
        feelsLike: Math.round(cur.apparent_temperature),
        wind: Math.round(cur.wind_speed_10m || 0),
        code: cur.weather_code || 0,
        max: daily.temperature_2m_max ? Math.round(daily.temperature_2m_max[0]) : null,
        min: daily.temperature_2m_min ? Math.round(daily.temperature_2m_min[0]) : null,
        rainProb: daily.precipitation_probability_max ? Math.round(daily.precipitation_probability_max[0]) : 0
      };
    }

    }

    async function fetchHarBrakhaShabbatTimes(forceToast = false) {
      state.shabbatTimes.loading = true;
      state.shabbatTimes.error = false;
      if (state.activeTab === 'today') renderActiveTab();
      try {
        const url = 'https://www.hebcal.com/shabbat?cfg=json&latitude=32.1928&longitude=35.2653&tzid=Asia%2FJerusalem&b=20&M=on';
        const res = await fetch(url);
        if (!res.ok) throw new Error('shabbat_err');
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        const candlesItem = items.find(i => i.category === 'candles');
        const havdalahItem = items.find(i => i.category === 'havdalah');
        const fmtTime = (iso) => {
          if (!iso) return '';
          const m = String(iso).match(/T(\d{2}:\d{2})/);
          return m ? m[1] : '';
        };
        state.shabbatTimes = {
          loading: false,
          error: false,
          candles: fmtTime(candlesItem && candlesItem.date),
          havdalah: fmtTime(havdalahItem && havdalahItem.date),
          fridayDate: candlesItem && candlesItem.date ? String(candlesItem.date).slice(0, 10) : ''
        };
        if (forceToast) showToast('זמני השבת בהר ברכה עודכנו 🕯️');
      } catch (e) {
        state.shabbatTimes = { loading: false, error: true, candles: '', havdalah: '', fridayDate: '' };
      }
      if (state.activeTab === 'today') renderActiveTab();
    }

    function getMonthTransactions(y = state.selectedYear, m = state.selectedMonth) {
      const prefix = `${y}-${String(m + 1).padStart(2, '0')}`;
      return getData('transactions')
        .filter(t => (t.date || '').startsWith(prefix))
        .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
    }

      const txs = getMonthTransactions();

      const balance = totalIncome - totalExpense;
      const bills = getData('bills').sort((a, b) => (a.dueDay || 1) - (b.dueDay || 1));

    function renderFinanceOverview(txs, totalIncome, totalExpense, balance) {
      const meta = state.householdMeta;
      const target = Math.max(1, Number(meta.savingsTarget) || 1);
      const current = Math.max(0, Number(meta.savingsCurrent) || 0);
      const savingsPct = Math.min(100, Math.round((current / target) * 100));
      const budgets = getBudgets();

      const catTotals = {};
      txs.filter(t => t.type === 'expense').forEach(t => {
        catTotals[t.category] = (catTotals[t.category] || 0) + (Number(t.amount) || 0);
      });
      const catRows = EXPENSE_CATEGORIES.map(cat => ({
        cat,
        sum: catTotals[cat.id] || 0,
        budget: Number(budgets[cat.id]) || 0
      })).filter(r => r.sum > 0 || r.budget > 0).sort((a, b) => b.sum - a.sum);


      const filteredTxs = state.financeFilter === 'all' ? txs : txs.filter(t => t.type === state.financeFilter);

      return `

    function handleQuickExpenseAdd(e) {
      e.preventDefault();
      const input = document.getElementById('quick-expense-input');
      const raw = (input && input.value || '').trim();
      if (!raw) return;
      const numMatch = raw.match(/(\d+(?:[.,]\d+)?)/);
      if (!numMatch) {
        showToast('הוסיפו סכום בשורה (למשל: קפה 32)', 'amber');
        return;
      }
      const amount = parseFloat(numMatch[1].replace(',', '.')) || 0;
      if (amount <= 0) { showToast('הסכום חייב להיות גדול מ-0', 'amber'); return; }
      const note = raw.replace(numMatch[0], '').replace(/₪/g, '').replace(/\s+/g, ' ').trim() || 'הוצאה מהירה';
      const category = inferFinanceCategory(note);
      const fd = new FormData(e.target);
      const payer = fd.get('payer') || 'both';
      const isCurrentSelected = (state.selectedYear === now.getFullYear() && state.selectedMonth === now.getMonth());
      const date = isCurrentSelected
        ? getTodayISO()
        : `${state.selectedYear}-${String(state.selectedMonth + 1).padStart(2, '0')}-01`;

      upsertItem('transactions', {
        type: 'expense',
        amount,
        category,
        isFixed: false,
        payer,
        note,
        date
      });
      showToast(`נרשם: ${note} · ${formatNIS(amount)} (${getCatInfo('expense', category).label})`, 'info');
    }

    function copyFixedFromPrevMonth() {
      let prevM = state.selectedMonth - 1;
      let prevY = state.selectedYear;
      if (prevM < 0) { prevM = 11; prevY--; }
      const prevFixed = getMonthTransactions(prevY, prevM).filter(t => t.isFixed);
      if (prevFixed.length === 0) {
        showToast(`לא נמצאו תנועות קבועות ב${HEBREW_MONTHS[prevM]} ${prevY}`, 'amber');
        return;
      }
      const curTxs = getMonthTransactions(state.selectedYear, state.selectedMonth);
      const existingKeys = new Set(curTxs.map(t => `${t.type}|${t.amount}|${(t.note || '').trim()}`));
      const maxDay = new Date(state.selectedYear, state.selectedMonth + 1, 0).getDate();
      let copied = 0;
      prevFixed.forEach(t => {
        const key = `${t.type}|${t.amount}|${(t.note || '').trim()}`;
        if (existingKeys.has(key)) return;
        existingKeys.add(key);
        const origDay = parseInt((t.date || '2026-01-01').split('-')[2], 10) || 1;
        const clampedDay = Math.min(origDay, maxDay);
        const newDate = `${state.selectedYear}-${String(state.selectedMonth + 1).padStart(2, '0')}-${String(clampedDay).padStart(2, '0')}`;
        upsertItem('transactions', {
          type: t.type,
          amount: t.amount,
          category: t.category,
          isFixed: true,
          payer: t.payer,
          note: t.note,
          date: newDate
        }, true);
        copied++;
      });
      updateHeaderAndNav();
      renderActiveTab();
      if (copied > 0) showToast(`שוכפלו ${copied} תנועות קבועות מ${HEBREW_MONTHS[prevM]}!`, 'info');
      else showToast('כל התנועות הקבועות כבר קיימות בחודש זה', 'amber');
    }

    function handleCsvFileUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => parseCsvFromText(String(reader.result || ''));
      reader.readAsText(file, 'UTF-8');
    }

    function parseCsvDate(raw) {
      const s = (raw || '').trim().replace(/"/g, '');
      let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
      m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
      if (m) {
        const y = m[3].length === 2 ? '20' + m[3] : m[3];
        return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
      }
      return getTodayISO();
    }

    function parseCsvFromText(text) {
      const lines = (text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const rows = [];
      lines.forEach((line, idx) => {
        const cols = line.split(/[,;\t]/).map(c => c.trim().replace(/^"|"$/g, ''));
        if (cols.length < 2) return;
        // Skip header row
        if (idx === 0 && /תאריך|date|סכום|amount|עסק/i.test(line)) return;
        let date = getTodayISO(), desc = '', amount = 0;
        if (cols.length >= 3) {
          date = parseCsvDate(cols[0]);
          desc = cols[1];
          amount = Math.abs(parseFloat(cols[2].replace(/[^\d.-]/g, '')) || 0);
        } else {
          desc = cols[0];
          amount = Math.abs(parseFloat(cols[1].replace(/[^\d.-]/g, '')) || 0);
        }
        if (!desc || amount <= 0) return;
        rows.push({
          checked: true,
          date,
          note: desc,
          amount,
          category: inferFinanceCategory(desc)
        });
      });
      window.__csvPreviewRows = rows;
      renderCsvPreviewBox();
    }

    function renderCsvPreviewBox() {
      const box = document.getElementById('csv-preview-box');
      if (!box) return;
      const rows = window.__csvPreviewRows || [];
      if (rows.length === 0) {
        box.innerHTML = '<p class="text-xs text-rose-600 font-bold">לא נמצאו שורות תקינות לייבוא.</p>';
        return;
      }
      box.innerHTML = `
        <div class="max-h-52 overflow-y-auto border border-stone-200 rounded-2xl divide-y divide-stone-100">
          ${rows.map((r, i) => `
            <div class="p-2.5 flex items-center justify-between gap-2 text-xs">
              <label class="flex items-center gap-2 min-w-0 cursor-pointer">
                <input type="checkbox" ${r.checked ? 'checked' : ''} onchange="window.__csvPreviewRows[${i}].checked=this.checked" class="w-4 h-4 accent-[#0F766E]" />
                <div class="min-w-0">
                  <p class="font-bold text-stone-900 truncate">${esc(r.note)}</p>
                  <p class="text-[10px] text-stone-400 tabular-nums">${formatDateShort(r.date)}</p>
                </div>
              </label>
              <div class="flex items-center gap-1.5 shrink-0">
                <select onchange="window.__csvPreviewRows[${i}].category=this.value" class="px-2 py-1 rounded-lg border border-stone-200 text-[11px] bg-white">
                  ${EXPENSE_CATEGORIES.map(c => `<option value="${c.id}" ${r.category === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
                </select>
                <span class="font-extrabold text-stone-900 tabular-nums w-14 text-left">${formatNIS(r.amount)}</span>
              </div>
            </div>
          `).join('')}
        </div>
        <button type="button" onclick="confirmImportCsvRows()" class="w-full py-3 rounded-2xl bg-[#0F766E] hover:bg-[#115E59] text-white font-bold text-sm transition">
          ייבא ${rows.filter(r => r.checked).length} הוצאות לחודש
        </button>
      `;
    }

    function confirmImportCsvRows() {
      const selected = (window.__csvPreviewRows || []).filter(r => r.checked);
      if (selected.length === 0) { showToast('לא נבחרו שורות לייבוא', 'amber'); return; }
      selected.forEach(r => {
        upsertItem('transactions', {
          type: 'expense',
          amount: r.amount,
          category: r.category,
          isFixed: false,
          payer: 'both',
          note: r.note,
          date: r.date
        }, true);
      });
      closeModal();
      updateHeaderAndNav();
      renderActiveTab();
      showToast(`יובאו ${selected.length} הוצאות בהצלחה!`, 'info');
    }

      const fd = new FormData(e.target);

      EXPENSE_CATEGORIES.forEach(c => { next[c.id] = Math.max(0, parseFloat(fd.get(`b_${c.id}`)) || 0); });

      showToast('תקציבי הקטגוריות עודכנו');
    }

      showToast(`הסכום עודכן ל-${formatNIS(val)}`);

          </div>

          ${bills.length === 0 ? `<div class="py-10 text-center text-stone-400 text-sm">עדיין לא הוגדרו חשבונות קבועים — בחרו מהרשימה למעלה.</div>` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                    <div class="min-w-0">
                      <p class="text-sm font-bold ${b.paid ? 'line-through text-stone-500' : 'text-stone-900 group-hover:text-[#0F766E]'} truncate transition">${esc(b.name)}</p>
                      <p class="text-[11px] text-stone-500">יעד: ${b.dueDay || 1} לחודש ${b.loggedThisMonth ? '· נרשם ✓' : ''}</p>

    function toggleBillPaid(id) {
      const bill = getData('bills').find(b => b.id === id);
      if (!bill) return;
      const nextPaid = !bill.paid;
      upsertItem('bills', { id: bill.id, paid: nextPaid });
      if (nextPaid && !bill.loggedThisMonth) {
        openConfirmModal({
          title: `"${bill.name}" סומן כשולם`,
          message: `לרשום אוטומטית הוצאה של ${formatNIS(bill.amount)} בתנועות החודש תחת "שכירות וחשבונות"?`,
          confirmLabel: 'רשום כהוצאה',
          danger: false,
          onConfirm: () => logBillAsExpense(bill.id)
        });
      }
    }

    function logBillAsExpense(billId) {
      const bill = getData('bills').find(b => b.id === billId);
      if (!bill) return;
      upsertItem('transactions', {
        type: 'expense',
        amount: Number(bill.amount) || 0,
        category: 'housing_bills',
        isFixed: true,
        payer: 'both',
        note: `תשלום חשבון: ${bill.name}`,
        date: getTodayISO()
      }, true);
      upsertItem('bills', { id: bill.id, paid: true, loggedThisMonth: true });
      showToast(`"${bill.name}" נרשם כהוצאה בתנועות החודש!`);
    }

          getData('bills').forEach(b => { b.paid = false; b.loggedThisMonth = false; });

          updateHeaderAndNav();
          renderActiveTab();

      });

      if (active.length === 0) return 'רשימת הקניות של הבית שלנו ריקה כרגע.';
      const byDept = {};
      active.forEach(item => {
        const d = item.dept || 'misc';
        if (!byDept[d]) byDept[d] = [];
        byDept[d].push(item);
      });
      const lines = ['*🛒 רשימת קניות — הבית שלנו*', ''];

        lines.push(`*${getDeptInfo(dKey).label}:*`);

        });
        lines.push('');
      });
      return lines.join('\n');
    }

    function parsePackageMessage(rawText) {
      const text = (rawText || '').trim();
      const lower = text.toLowerCase();

      // Detect store / courier
      let store = 'הזמנה אונליין';
      if (/shein|שיין/.test(lower)) store = 'שיין (SHEIN)';
      else if (/aliexpress|עליאקספרס|עלי אקספרס/.test(lower)) store = 'עליאקספרס';
      else if (/temu|טמו/.test(lower)) store = 'טמו (Temu)';
      else if (/amazon|אמזון/.test(lower)) store = 'אמזון';
      else if (/ksp/.test(lower)) store = 'KSP';
      else if (/ivory|אייבורי/.test(lower)) store = 'אייבורי';
      else if (/zara|זארה/.test(lower)) store = 'זארה';
      else if (/צ׳יטה|צ'יטה|cheetah/.test(lower)) store = 'צ׳יטה שליחויות';
      else if (/hfd/.test(lower)) store = 'HFD שליחויות';
      else if (/דואר ישראל|דבר דואר/.test(lower)) store = 'דואר ישראל';

      // Detect status
      let status = 'ordered';
      if (/מחכה|הגיעה|ממתינה|לאיסוף|מוכנה|מדף|לוקר|קוד איסוף|קוד תא/.test(text)) status = 'ready';
      else if (/בדרך|נשלחה|שליח|חלוקה|יצאה/.test(text)) status = 'in_transit';

      // Extract tracking URL if any
      const urlMatch = text.match(/https?:\/\/[^\s]+/i);
      const trackingUrl = urlMatch ? urlMatch[0].replace(/[.,;)]+$/, '') : '';

      // Extract tracking code (alphanumeric 6-18 chars with digits, not part of URL)
      const textNoUrl = text.replace(/https?:\/\/[^\s]+/gi, ' ');
      let trackingCode = '';
      const explicitTrack = textNoUrl.match(/(?:מספר מעקב|מס['׳]? מעקב|מס['׳]? משלוח|דבר דואר|הזמנה)[:\s#-]*([A-Za-z0-9-]{5,20})/);
      if (explicitTrack) trackingCode = explicitTrack[1];
      else {
        const genericTrack = textNoUrl.match(/\b([A-Z]{2}\d{6,12}[A-Z]{0,2}|\d{8,16})\b/);
        if (genericTrack) trackingCode = genericTrack[1];
      }

      // Extract pickup point / shelf / code
      const pickupParts = [];
      const locMatch = textNoUrl.match(/(?:בנקודת איסוף|בנקודת|במכולת|בסניף|בלוקר|בדואר|אצל)[^.,\n]{2,45}/);
      if (locMatch) pickupParts.push(locMatch[0].trim());
      const shelfMatch = textNoUrl.match(/(?:מדף|תא|קוד איסוף|קוד תא|קוד)[:\s#-]*[A-Za-z0-9-]{1,10}/g);
      if (shelfMatch) {
        shelfMatch.forEach(m => {
          const clean = m.trim();
          if (!pickupParts.some(p => p.includes(clean))) pickupParts.push(clean);
        });
      }
      const pickupPoint = pickupParts.join(' · ');

      // Build clean title
      let title = `חבילה מ-${store}`;
      const fromMatch = textNoUrl.match(/מ(?:את|חברת|חנות)?\s*([א-תA-Za-z0-9\s]{2,22})/);
      if (store === 'הזמנה אונליין' && fromMatch) title = `חבילה מ${fromMatch[1].trim()}`;

      return { title, store, status, pickupPoint, trackingCode, trackingUrl, rawText: text };
    }

    function handleQuickShopAdd(e) {
      e.preventDefault();
      const form = e.target;
      const input = document.getElementById('quick-shop-input');
      const name = (input.value || '').trim();
      if (!name) return;
      const inferred = inferStoreAndDept(name);
      const fd = new FormData(form);
      const storeVal = fd.get('store');
      const deptVal = fd.get('dept');
      const res = addOrMergeShoppingItem({
        name,
        qty: parseFloat(fd.get('qty')) || 1,
        unit: fd.get('unit') || "יח'",
        store: storeVal && storeVal !== 'auto' ? storeVal : inferred.store,
        dept: deptVal && deptVal !== 'auto' ? deptVal : inferred.dept,
        estPrice: parseFloat(fd.get('estPrice')) || 0,
        note: (fd.get('note') || '').trim(),
        urgent: fd.get('urgent') === 'on'
      });
      showToast(res.merged ? `אוחדה הכמות של "${name}" ברשימה` : `"${name}" נוסף לרשימת הקניות`);
    }

    function addStapleToList(stapleId) {
      const st = getStaples().find(s => s.id === stapleId);
      if (!st) return;
      const res = addOrMergeShoppingItem({
        name: st.name, qty: st.qty, unit: st.unit, store: st.store, dept: st.dept, estPrice: st.estPrice, urgent: false, note: ''
      });
      showToast(res.merged ? `עודכנה הכמות של "${st.name}"` : `"${st.name}" נוסף לרשימה`);
    }


    function openStaplesCatalogModal() {
      const staples = getStaples();
      const activeSet = new Set(getData('shopping').filter(i => !i.checked).map(i => normalizeShopName(i.name)));
      const byDept = {};
      staples.forEach(st => {
        const d = st.dept || 'misc';
        if (!byDept[d]) byDept[d] = [];
        byDept[d].push(st);
      });
      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-extrabold text-stone-900">קטלוג מוצרי בית בסיסיים (${staples.length})</h3>
              <p class="text-xs text-stone-500">לחצו על כל מוצר כדי להוסיף מיד לרשימת הקניות</p>
            </div>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-xl bg-stone-100 hover:bg-stone-200 flex items-center justify-center shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="space-y-4 max-h-[65vh] overflow-y-auto pl-1">
            ${Object.entries(byDept).map(([dKey, items]) => {
              const dept = getDeptInfo(dKey);
              return `
                <div class="space-y-2">
                  <h4 class="text-xs font-extrabold text-stone-700 flex items-center gap-1.5">
                    <i data-lucide="${dept.icon}" class="w-3.5 h-3.5 text-[#0F766E]"></i>
                    ${esc(dept.label)} (${items.length})
                  </h4>
                  <div class="flex flex-wrap gap-1.5">
                    ${items.map(st => {
                      const onList = activeSet.has(normalizeShopName(st.name));
                      return `
                        <button type="button" onclick="addStapleToList('${esc(st.id)}'); openStaplesCatalogModal();"
                          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border transition ${onList ? 'bg-teal-50 border-teal-300 text-[#0F766E]' : 'bg-stone-50 hover:bg-stone-100 border-stone-200 text-stone-700'}">
                          <i data-lucide="${onList ? 'check' : 'plus'}" class="w-3 h-3"></i>
                          <span>${esc(st.name)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <button type="button" onclick="closeModal()" class="w-full py-2.5 rounded-2xl bg-stone-900 text-white font-bold text-sm">סגור</button>
        </div>
      `);

    function addNewStaple(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = (fd.get('name') || '').trim();
      if (!name) return;
      const inf = inferStoreAndDept(name);
      const next = getStaples().concat([{
        id: genId('st'), name, qty: parseFloat(fd.get('qty')) || 1, unit: "יח'", store: inf.store, dept: inf.dept, estPrice: 0
      }]);
      updateMeta({ staples: next });
      openStaplesManagerModal();
      showToast(`"${name}" נוסף למוצרי היסוד`);
    }

    function removeStaple(id) {
      const next = getStaples().filter(s => s.id !== id);
      updateMeta({ staples: next });
      openStaplesManagerModal();
    }

    function toggleShopItemChecked(id) {
      const item = getData('shopping').find(i => i.id === id);
      if (!item) return;
      upsertItem('shopping', { id: item.id, checked: !item.checked });
    }

    function stepShopQty(id, delta) {
      const item = getData('shopping').find(i => i.id === id);
      if (!item) return;
      upsertItem('shopping', { id: item.id, qty: Math.max(0.5, (Number(item.qty) || 1) + delta) });
    }

      state.raw.shopping = (state.raw.shopping || []).filter(i => !(i.householdId === state.householdId && i.checked));

      renderActiveTab();

    function renderChoresSection() {
      const all = getData('chores');
      const list = all.filter(c => state.choreAssigneeFilter === 'all' || c.assignee === state.choreAssigneeFilter)
        .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0));
      const p1 = state.householdMeta.partner1Name || 'אני';
      const p2 = state.householdMeta.partner2Name || 'אשתי';
      const doneCnt = all.filter(c => c.done).length;
      const pct = all.length > 0 ? Math.round((doneCnt / all.length) * 100) : 0;

      return `
        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-stone-200/80 shadow-soft space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h3 class="text-base font-extrabold text-stone-900">מטלות בית</h3>

              <button type="button" onclick="resetRecurringChores()" class="px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold transition">אפס חוזרות</button>
              <button type="button" onclick="openChoreModal()" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-[#0F766E] hover:bg-[#115E59] text-white text-xs font-bold transition"><i data-lucide="plus" class="w-3.5 h-3.5"></i> מטלה</button>
            </div>
          </div>

          <!-- 1-Line Quick Add Chore + Templates -->
          <div class="space-y-2.5 bg-stone-50/70 p-3 rounded-2xl border border-stone-200/70">
            <form onsubmit="handleQuickChoreAdd(event)" class="flex items-center gap-2">
              <input type="text" required name="title" placeholder="הוסף מטלה מהירה בשורה אחת..." class="flex-1 px-3 py-2 rounded-xl bg-white border border-stone-200 text-xs sm:text-sm focus:border-[#0F766E] focus:outline-none" />
              <select name="assignee" class="px-2.5 py-2 rounded-xl bg-white border border-stone-200 text-xs font-bold">
                <option value="both">שנינו</option>
                <option value="partner1">${esc(p1)}</option>
                <option value="partner2">${esc(p2)}</option>
              </select>
              <button type="submit" class="px-3.5 py-2 rounded-xl bg-[#0F766E] hover:bg-[#115E59] text-white text-xs font-bold shrink-0 transition">+ הוסף</button>
            </form>
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              <span class="text-[11px] font-bold text-stone-400 shrink-0">תבניות מוכנות:</span>
              ${CHORE_TEMPLATES.map(tpl => `
                <button type="button" onclick="applyChoreTemplate('${tpl.id}')" class="shrink-0 px-2.5 py-1 rounded-full bg-white hover:bg-teal-50 border border-stone-200 hover:border-teal-300 text-[11px] font-bold text-stone-700 transition">${esc(tpl.label)}</button>
              `).join('')}
            </div>
            <div class="pt-1.5 border-t border-stone-200/60">
              <div class="flex items-center justify-between mb-1.5">
                <p class="text-[11px] font-bold text-stone-400">משימות בית נפוצות (לחיצה להוספה):</p>
                <button type="button" onclick="openChoresCatalogModal()" class="px-2.5 py-0.5 rounded-lg bg-teal-50 hover:bg-teal-100 text-[#0F766E] text-[11px] font-extrabold transition">בחר מקטלוג מטלות (24)</button>
              </div>
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                ${COMMON_CHORES.map(chTitle => {
                  const alreadyOpen = all.some(c => !c.done && c.title.trim() === chTitle);
                  return `
                    <button type="button" onclick="addCommonChore('${esc(chTitle)}')"
                      class="shrink-0 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold border transition ${alreadyOpen ? 'bg-teal-50 border-teal-200 text-[#0F766E]' : 'bg-white hover:bg-stone-100 border-stone-200 text-stone-700'}">
                      <i data-lucide="${alreadyOpen ? 'check' : 'plus'}" class="w-3 h-3"></i>
                      <span>${esc(chTitle)}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
            ${[['all', 'הכל'], ['partner1', p1], ['partner2', p2], ['both', 'שנינו']].map(([k, lbl]) => `
              <button type="button" onclick="setChoreAssigneeFilter('${k}')" class="px-3 py-1.5 rounded-full text-xs font-bold border transition ${state.choreAssigneeFilter === k ? 'bg-stone-900 text-white border-stone-900' : 'bg-stone-50 text-stone-600 border-stone-200'}">${esc(lbl)}</button>
            `).join('')}
          </div>

          ${list.length === 0 ? `<div class="py-8 text-center text-xs text-stone-400">אין מטלות להצגה.</div>` : `
            <div class="divide-y divide-stone-100">
              ${list.map(c => {
                const freq = CHORE_FREQUENCIES[c.frequency] || CHORE_FREQUENCIES.once;
                const prio = CHORE_PRIORITIES[c.priority] || CHORE_PRIORITIES.normal;
                return `
                  <div class="py-3 flex items-center justify-between gap-3">
                    <button type="button" onclick="toggleChoreDone('${esc(c.id)}')" class="flex-1 flex items-center gap-3 min-w-0 text-right group py-0.5">
                      <span class="w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition ${c.done ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-stone-300 group-hover:border-[#0F766E]'}">
                        ${c.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                      </span>
                      <div class="min-w-0">
                        <p class="text-sm font-bold ${c.done ? 'line-through text-stone-400' : 'text-stone-900 group-hover:text-[#0F766E]'} transition">${esc(c.title)}</p>
                        <div class="flex items-center gap-1.5 flex-wrap mt-1">
                          <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-stone-500"><i data-lucide="${getPersonIcon(c.assignee)}" class="w-3 h-3"></i> ${esc(getPersonLabel(c.assignee))}</span>
                          <span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold ${freq.cls}">${freq.label}</span>
                          <span class="px-1.5 py-0.5 rounded-md border text-[10px] font-bold ${prio.cls}">${prio.label}</span>
                          ${c.dueDate ? `<span class="text-[11px] text-stone-400 tabular-nums">${formatDateShort(c.dueDate)}</span>` : ''}
                        </div>
                      </div>
                    </button>
                    <div class="flex items-center gap-1 shrink-0">
                      <button type="button" onclick="openChoreModal('${esc(c.id)}')" class="w-8 h-8 rounded-xl hover:bg-stone-100 text-stone-400 hover:text-stone-700 flex items-center justify-center"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                      <button type="button" onclick="confirmDeleteItem('chores','${esc(c.id)}','המטלה')" class="w-8 h-8 rounded-xl hover:bg-rose-50 text-stone-400 hover:text-rose-600 flex items-center justify-center"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>

    function handleQuickChoreAdd(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const title = (fd.get('title') || '').trim();
      if (!title) return;
      upsertItem('chores', {
        title,
        assignee: fd.get('assignee') || 'both',
        frequency: 'once',
        priority: 'normal',
        dueDate: getTodayISO(),
        done: false
      });
      showToast(`המטלה "${title}" נוספה`);
    }

    function openChoresCatalogModal() {
      const openTitles = new Set(getData('chores').filter(c => !c.done).map(c => c.title.trim()));
      openModal(`
        <div class="p-6 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-extrabold text-stone-900">קטלוג מטלות בית (24)</h3>
              <p class="text-xs text-stone-500">בחרו כל מטלה שתרצו להוסיף מיד לרשימת המטלות</p>
            </div>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-xl bg-stone-100 hover:bg-stone-200 flex items-center justify-center shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="space-y-4 max-h-[65vh] overflow-y-auto pl-1">
            ${CHORE_CATALOG.map(grp => `
              <div class="space-y-2">
                <h4 class="text-xs font-extrabold text-stone-700 flex items-center gap-1.5">
                  <i data-lucide="${grp.icon}" class="w-3.5 h-3.5 text-[#0F766E]"></i>
                  ${esc(grp.group)}
                </h4>
                <div class="flex flex-wrap gap-1.5">
                  ${grp.items.map(title => {
                    const exists = openTitles.has(title);
                    return `
                      <button type="button" onclick="addCommonChore('${esc(title)}'); openChoresCatalogModal();"
                        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border transition ${exists ? 'bg-teal-50 border-teal-300 text-[#0F766E]' : 'bg-stone-50 hover:bg-stone-100 border-stone-200 text-stone-700'}">
                        <i data-lucide="${exists ? 'check' : 'plus'}" class="w-3 h-3"></i>
                        <span>${esc(title)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
          <button type="button" onclick="closeModal()" class="w-full py-2.5 rounded-2xl bg-stone-900 text-white font-bold text-sm">סגור</button>
        </div>
      `);
    }

    function addCommonChore(title) {
      const exists = getData('chores').some(c => !c.done && c.title.trim() === title);
      if (exists) { showToast(`"${title}" כבר נמצאת ברשימת המטלות`, 'amber'); return; }
      upsertItem('chores', {
        title, assignee: 'both', frequency: 'once', priority: 'normal', dueDate: getTodayISO(), done: false
      });
      showToast(`"${title}" נוספה למטלות הבית`);
    }

    function applyChoreTemplate(tplId) {
      const tpl = CHORE_TEMPLATES.find(t => t.id === tplId);
      if (!tpl) return;
      const openTitles = new Set(getData('chores').filter(c => !c.done).map(c => c.title.trim()));
      let added = 0;
      tpl.items.forEach(title => {
        if (openTitles.has(title)) return;
        openTitles.add(title);
        upsertItem('chores', {
          title,
          assignee: 'both',
          frequency: 'once',
          priority: 'normal',
          dueDate: getTodayISO(),
          done: false
        }, true);
        added++;
      });
      updateHeaderAndNav();
      renderActiveTab();
      if (added > 0) showToast(`נוספו ${added} מטלות מתבנית "${tpl.label}"!`, 'info');
      else showToast(`כל מטלות התבנית "${tpl.label}" כבר פתוחות`, 'amber');
    }

    function toggleChoreDone(id) {
      const c = getData('chores').find(x => x.id === id);
      if (!c) return;
      const nextDone = !c.done;
      upsertItem('chores', { id: c.id, done: nextDone });
      if (nextDone) {
        const remaining = getData('chores').filter(x => !x.done).length;

    function saveChoreForm(e, editId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const existing = editId ? getData('chores').find(x => x.id === editId) : null;
      upsertItem('chores', {
        id: editId || genId('ch'),
        title: (fd.get('title') || '').trim(),
        assignee: fd.get('assignee') || 'both',
        frequency: fd.get('frequency') || 'weekly',
        priority: fd.get('priority') || 'normal',
        dueDate: fd.get('dueDate') || '',
        done: existing ? existing.done : false
      });
      closeModal();
      showToast(editId ? 'המטלה עודכנה' : 'המטלה נוספה');

    function mapLegacyRoomId(roomId) {
      if (roomId === 'kitchen' || roomId === 'living') return 'living_kitchen';
      if (roomId === 'bathroom') return 'bath_toilet';
      if (roomId === 'bedroom' || roomId === 'extra_room' || roomId === 'living_kitchen' || roomId === 'bath_toilet') return roomId;
      return 'extra_room';
    }

    function handleQuickRepairAdd(e, roomId) {
      e.preventDefault();
      const input = e.target.querySelector('input[name="title"]');

      upsertItem('repairs', {
        title,
        room: roomId,
        urgency: 'normal',
        status: 'waiting',
        assignee: 'partner1',
        estCost: 0,
        parts: '',
        note: ''

      showToast(`התיקון נוסף ל"${getRoomInfo(roomId).label}"`);

                </div>

    function cycleRepairStatus(id) {
      const r = getData('repairs').find(x => x.id === id);
      if (!r) return;
      const next = (REPAIR_STATUSES[r.status] || REPAIR_STATUSES.waiting).next;
      upsertItem('repairs', { id: r.id, status: next });
      if (next === 'done') triggerCelebration(`🎉 התיקון "${r.title}" הושלם!`);
      else showToast(`סטטוס התיקון עודכן ל"${REPAIR_STATUSES[next].label}"`);
    }

    function addRepairPartsToShopping(id) {
      const r = getData('repairs').find(x => x.id === id);
      if (!r || !r.parts) return;
      const res = addOrMergeShoppingItem({

        estPrice: Number(r.estCost) || 0, urgent: r.urgency === 'urgent', note: `עבור תיקון: ${r.title}`
      });
      showToast(res.merged ? `"${r.parts}" אוחד ברשימת הקניות` : `"${r.parts}" נוסף לקניות תחת טמבוריה`);

    function handlePinImageUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          const scale = img.width > maxW ? (maxW / img.width) : 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          window.__pendingPinImageData = canvas.toDataURL('image/jpeg', 0.78);
          const st = document.getElementById('pin-img-status');
          if (st) st.textContent = 'התמונה נטענה בהצלחה ✓';
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

      const fd = new FormData(e.target);
      upsertItem('designPins', {

        room: fd.get('room') || 'living_kitchen',
        pinterestUrl: (fd.get('pinterestUrl') || '').trim(),

        imageData: window.__pendingPinImageData || '',

      closeModal();
      showToast(editId ? 'רעיון העיצוב עודכן' : 'נוסף ללוח העיצוב!');

    function changeCalMonth(delta) {
      let m = state.calMonth + delta;
      let y = state.calYear;
      if (m < 0) { m = 11; y--; }
      else if (m > 11) { m = 0; y++; }
      state.calMonth = m;
      state.calYear = y;
      renderActiveTab();
    }

    function goToCalToday() {
      const t = new Date();
      state.calYear = t.getFullYear();

      state.calSelectedDate = getTodayISO();

    function getCalendarItemsForDate(iso) {
      const items = [];
      getData('calendarEvents').filter(e => e.date === iso).forEach(ev => {
        items.push({ kind: 'event', id: ev.id, title: ev.title, time: ev.allDay ? 'כל היום' : (ev.startTime || ''), cat: getCalCat(ev.category), colorObj: getEventColorObj(ev.color, ev.category), raw: ev });
      });
      if (state.calShowOverlays) {
        const dayNum = parseInt(iso.split('-')[2], 10);
        getData('bills').filter(b => Number(b.dueDay) === dayNum).forEach(b => {
          items.push({ kind: 'bill', id: b.id, title: `חשבון ${b.name} (${formatNIS(b.amount)})`, time: b.paid ? 'שולם' : 'לתשלום', dot: b.paid ? 'bg-emerald-500' : 'bg-rose-500' });
        });
        getData('chores').filter(c => c.dueDate === iso && !c.done).forEach(c => {
          items.push({ kind: 'chore', id: c.id, title: `מטלה: ${c.title}`, time: getPersonLabel(c.assignee), dot: 'bg-sky-500' });
        });
        getData('shoppingReminders').filter(r => r.date === iso && !r.completed).forEach(r => {
          items.push({ kind: 'shop', id: r.id, title: `קניות: ${r.title}`, time: r.time || '', dot: 'bg-teal-500' });
        });
      }
      return items;
    }

    function renderCalendarSection() {
      const y = state.calYear;
      const m = state.calMonth;
      const firstDayOfWeek = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const todayIso = getTodayISO();
      const hebMonthRange = getHebrewMonthRangeLabel(y, m);
      const selDate = state.calSelectedDate || todayIso;
      const selHeb = getHebrewDateInfo(selDate);
      const selHolidays = getHebrewHolidaysForDate(selHeb);
      const selItems = getCalendarItemsForDate(selDate);
      const googleEmail = (state.householdMeta.googleCalendarEmail || '').trim();

      const cells = [];
      for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const heb = getHebrewDateInfo(iso);
        const holidays = getHebrewHolidaysForDate(heb);
        const dayItems = getCalendarItemsForDate(iso);
        cells.push({ d, iso, heb, holidays, items: dayItems, isSat: new Date(y, m, d).getDay() === 6, isFri: new Date(y, m, d).getDay() === 5 });
      }

      // Upcoming 14 days for Agenda View
      const agendaDays = [];
      for (let offset = 0; offset < 21; offset++) {
        const iso = offsetDaysISO(offset);
        const heb = getHebrewDateInfo(iso);
        const holidays = getHebrewHolidaysForDate(heb);
        const items = getCalendarItemsForDate(iso);
